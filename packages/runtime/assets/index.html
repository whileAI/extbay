<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extensions</title>
<style>
:host{display:block;min-height:100%;color:var(--text-main-color,#2e2f33);background:var(--bg-body-color,#f6f7f8);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}.extbay-page{min-height:100vh;padding:0 25px 32px;background:var(--bg-body-color,#f6f7f8)}button{font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.page-head{display:flex;align-items:center;min-height:72px;padding:18px 0 14px}.page-title{font-size:24px;font-weight:500;line-height:32px;margin:0;color:var(--text-main-color,#2e2f33)}.breadcrumb{font-size:12px;color:var(--text-muted-color,#6b7280);margin-bottom:3px}.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:6px;background:transparent;color:var(--text-muted-color,#6b7280);font-size:22px;line-height:1}.close:hover{background:var(--bg-navtabs-hover-color,#eef0f2);color:var(--text-main-color,#2e2f33)}.widget{overflow:hidden;border:1px solid var(--border-widget,#d8dadd);border-radius:12px;background:var(--bg-widget-color,#fff);box-shadow:0 1px 2px rgba(0,0,0,.05)}.tabs{display:flex;gap:24px;height:49px;padding:0 20px;border-bottom:1px solid var(--border-widget,#d8dadd);background:var(--bg-widget-color,#fff)}.tabs button{position:relative;border:0;background:transparent;padding:0 2px;color:var(--text-muted-color,#667085);font-size:13px;font-weight:500}.tabs button:hover{color:var(--text-main-color,#2e2f33)}.tabs button.active{color:#2187d9}.tabs button.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#2187d9}.notice{margin:16px 0 0;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid #93c5fd;border-radius:8px;background:#eff6ff;color:#1e3a5f}.notice[hidden]{display:none}.notice .muted{color:#475569}main{padding:16px 20px 20px}.section-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:500;color:var(--text-widget-header-color,var(--text-main-color,#2e2f33))}.section-title svg{width:16px;height:16px;color:#2187d9}.list{overflow:hidden;border:1px solid var(--border-table-color,var(--border-widget,#d8dadd));border-radius:8px}.card{min-height:82px;padding:15px 16px;display:flex;gap:12px;align-items:center;background:var(--bg-widget-color,#fff);border-bottom:1px solid var(--border-table-color,var(--border-widget,#d8dadd))}.card:last-child{border-bottom:0}.card:hover{background:var(--bg-hover-table-color,#f8fafc)}.grow{flex:1;min-width:0}.name{font-size:14px;font-weight:500;color:var(--text-main-color,#2e2f33)}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:5px}.muted{color:var(--text-muted-color,#667085);font-size:12px;line-height:18px}.badge{display:inline-flex;align-items:center;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:500}.badge.enabled{background:#dcfce7;color:#166534}.badge.disabled{background:#f1f5f9;color:#64748b}.badge.verified{background:#dbeafe;color:#1d4ed8}.permissions{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}.permission{padding:2px 7px;border-radius:4px;background:var(--bg-widget-table-color,#f3f4f6);color:var(--text-muted-color,#667085);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.warning{color:#9a6700;font-size:12px;margin-top:7px}.actions{display:flex;align-items:center;gap:8px}.action,.primary{min-height:32px;border-radius:5px;padding:6px 12px;font-size:12px;font-weight:500}.action{border:1px solid var(--border-btn-default-color,#c8cbd0);background:var(--bg-widget-color,#fff);color:var(--text-main-color,#2e2f33)}.action:hover{background:var(--bg-navtabs-hover-color,#eef0f2)}.primary{border:1px solid #2187d9;background:#2187d9;color:#fff}.primary:hover{background:#1976bd}.empty{padding:54px 20px;text-align:center;color:var(--text-muted-color,#667085);font-size:13px}.empty-icon{display:block;margin:0 auto 10px;width:34px;height:34px;color:#98a2b3}.setting{padding:18px 16px}.setting+.setting{border-top:1px solid var(--border-table-color,var(--border-widget,#d8dadd))}.setting-title{font-size:13px;font-weight:500}.setting-copy{max-width:720px;margin-top:4px}iframe.extension{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:4}.back{position:fixed;right:18px;top:18px;z-index:5;border:1px solid #c8cbd0;border-radius:5px;padding:7px 12px;background:#fff;color:#2e2f33;box-shadow:0 1px 3px rgba(0,0,0,.15)}@media(max-width:720px){.extbay-page{padding:0 12px 20px}.card,.notice{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.tabs{gap:16px;padding:0 14px}main{padding:14px}}
</style></head>
<body><div class="extbay-page"><header class="page-head"><div><div class="breadcrumb">Portainer / Extensions</div><h1 class="page-title">Extensions</h1></div><button class="close" aria-label="Close extensions" title="Close">×</button></header><section class="widget"><nav class="tabs"><button data-tab="installed" class="active">Installed</button><button data-tab="updates">Updates</button><button data-tab="settings">Settings</button></nav><aside class="notice" hidden></aside><main></main></section></div><script src="/extbay-ui.js"></script></body></html>
