<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExtBay</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e2e8f0;background:#0f172a}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;padding:18px 24px;border-bottom:1px solid #334155}h1{font-size:20px;margin:0 auto 0 0}button{cursor:pointer}.close{background:none;border:0;color:#cbd5e1;font-size:24px}.tabs{display:flex;gap:8px;padding:16px 24px}.tabs button{padding:8px 14px;border:0;border-radius:7px;background:#1e293b;color:#cbd5e1}.tabs button.active{background:#2563eb;color:white}main{padding:0 24px 24px}.card{border:1px solid #334155;background:#111827;border-radius:10px;padding:16px;margin:10px 0;display:flex;gap:16px;align-items:center}.card .grow{flex:1}.muted{color:#94a3b8;font-size:13px}.action{border:1px solid #475569;border-radius:6px;background:#1e293b;color:white;padding:7px 10px}.empty{padding:48px;text-align:center;color:#94a3b8}iframe.extension{position:fixed;inset:0;width:100%;height:100%;border:0;background:white;z-index:4}.back{position:fixed;right:16px;top:16px;z-index:5;border:0;border-radius:7px;padding:8px 12px;background:#111827;color:white}
